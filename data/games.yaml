# Games — the single canonical list powering the whole hub.
#
# The listing, search, filters, sort, builder counts, related games, footer,
# online count, and the static checks all derive from this file. To add a
# game, copy one block, fill in the fields, and drop a screenshot at
# assets/<id>.png (then run `npm run assets`). That's it.
#
# Quote any value containing a literal "#" (e.g. tagline: "Be the #1 player",
# accent: "#ff3d7f") — an unquoted " #" starts a comment and the parser will
# flag it. Also quote values that look like a number or true/false/null when you
# mean them as text (e.g. name: "2048").
#
# Fields:
#   id          Required. URL slug (#/game/<id>) AND the screenshot base name
#               (assets/<id>.png, assets/<id>-card.webp, assets/<id>-detail.webp).
#               Lowercase letters, numbers, and dashes.
#   name        Required. Display name.
#   status      Required. "Live" or "WIP".
#   url         Play URL. Required when status is Live; optional for WIP (a
#               preview/early build link).
#   source      Required. https:// URL to the source repository.
#   creator     Required. A creator id from data/creators.yaml.
#   editors     List of creator ids who edited it. Use [] for none.
#   genre       Required. Drives the genre filter chips.
#   year        Required. Release year.
#   accent      Required. Hex accent color (quoted, leading "#").
#   tagline     Required. One short line shown on the card and detail.
#   description Required. A paragraph. The `>` folds wrapped lines into one.
#   screenshot  Optional. Set to false for games with no capture (uses the
#               striped placeholder). Defaults to true (derived from id).

