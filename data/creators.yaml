# Builders — the friend group behind First or Eighth.
#
# Each top-level key is a creator id, referenced from data/games.yaml by
# `creator:` and `editors:`. To add a builder, copy a block below and fill in
# the fields. Order here does not matter; the site sorts builders by name.
#
# Quote any value containing a literal "#" (e.g. color: "#ff3d7f") — an
# unquoted " #" starts a comment and the parser will flag it. Comments belong
# on their own line.
#
# Fields (all required unless noted):
#   name    Display name.
#   handle  GitHub-style handle.
#   github  Full https:// URL to their GitHub profile.
#   color   Hex accent color.
#   bio     One-line bio (optional).

michael:
  name: Michael
  handle: "@mchen04"
  github: https://github.com/mchen04
  color: "#ff3d7f"

jeremy:
